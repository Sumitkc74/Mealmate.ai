name: CI & MLOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    shell: bash

jobs:
  server:
    name: Server (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20']
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci
      - run: npm run build

  client:
    name: Client (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20']
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  ai-service:
    name: AI service & MLOps Eval (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12']
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ai-service/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run unit & integration test suites
        run: pytest -v
      - name: Run RAG Quality & Allergen Safety benchmark
        run: python eval/eval_rag.py
      - name: Run Recommender offline evaluation
        run: python eval/run_eval.py
      - name: Upload evaluation reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-eval-reports
          path: ai-service/eval/reports/

  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [server, client, ai-service]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: server
          push: false
          tags: mealmate-server:ci
      - name: Build client image
        uses: docker/build-push-action@v6
        with:
          context: client
          push: false
          tags: mealmate-client:ci
      - name: Build AI service image
        uses: docker/build-push-action@v6
        with:
          context: ai-service
          push: false
          tags: mealmate-ai:ci
