apiVersion: apps/v1
kind: Deployment
metadata:
  name: mealmate-server
  namespace: mealmate
  labels:
    app.kubernetes.io/name: mealmate-server
    app.kubernetes.io/component: api-gateway
    app.kubernetes.io/part-of: mealmate-platform
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: mealmate-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mealmate-server
        app.kubernetes.io/component: api-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: server
          image: ghcr.io/sumitkc74/mealmate-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: mealmate-config
            - secretRef:
                name: mealmate-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: mealmate-server
  namespace: mealmate
  labels:
    app.kubernetes.io/name: mealmate-server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mealmate-server
  ports:
    - name: http
      port: 5000
      targetPort: http
      protocol: TCP

