apiVersion: v1
kind: ConfigMap
metadata:
  name: mealmate-config
  namespace: mealmate
  labels:
    app.kubernetes.io/name: mealmate
data:
  NODE_ENV: "production"
  PORT: "5000"
  AI_SERVICE_URL: "http://mealmate-ai-service:8000"
  ALLOWED_ORIGINS: "https://mealmate.ai,http://localhost:3000"
  LOG_LEVEL: "INFO"
  AI_ENV: "production"
  AI_PORT: "8000"
  LLM_PROVIDER: "gemini"
  GEMINI_MODEL: "models/gemini-1.5-flash"
  AZURE_SEARCH_INDEX: "mealmate-recipes"

