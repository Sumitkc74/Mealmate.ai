apiVersion: v1
kind: Secret
metadata:
  name: mealmate-secrets
  namespace: mealmate
  labels:
    app.kubernetes.io/name: mealmate
type: Opaque
stringData:
  # In production, inject from Azure Key Vault, AWS Secrets Manager, or HashiCorp Vault via CSI driver
  MONGO_URI: "mongodb+srv://<user>:<password>@cluster0.mongodb.net/mealmate?retryWrites=true&w=majority"
  JWT_SECRET: "replace-with-a-cryptographically-secure-random-256-bit-key"
  GEMINI_API_KEY: "AIzaSy..."
  # Optional Azure AI integration
  AZURE_OPENAI_ENDPOINT: "https://your-resource.openai.azure.com/"
  AZURE_OPENAI_API_KEY: "your-azure-openai-key"
  AZURE_OPENAI_DEPLOYMENT: "gpt-4o-mini"
  AZURE_SEARCH_ENDPOINT: "https://your-search.search.windows.net"
  AZURE_SEARCH_API_KEY: "your-azure-search-key"

