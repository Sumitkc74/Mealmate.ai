apiVersion: apps/v1
kind: Deployment
metadata:
  name: mealmate-client
  namespace: mealmate
  labels:
    app.kubernetes.io/name: mealmate-client
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: mealmate-platform
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: mealmate-client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mealmate-client
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: client
          image: ghcr.io/sumitkc74/mealmate-client:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mealmate-client
  namespace: mealmate
  labels:
    app.kubernetes.io/name: mealmate-client
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mealmate-client
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP

