apiVersion: apps/v1
kind: Deployment
metadata:
  name: mealmate-ai-service
  namespace: mealmate
  labels:
    app.kubernetes.io/name: mealmate-ai-service
    app.kubernetes.io/component: ml-backend
    app.kubernetes.io/part-of: mealmate-platform
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: mealmate-ai-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mealmate-ai-service
        app.kubernetes.io/component: ml-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: ai-service
          image: ghcr.io/sumitkc74/mealmate-ai-service:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: mealmate-config
            - secretRef:
                name: mealmate-secrets
                optional: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1.5Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: mealmate-ai-service
  namespace: mealmate
  labels:
    app.kubernetes.io/name: mealmate-ai-service
    app.kubernetes.io/component: ml-backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mealmate-ai-service
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP

